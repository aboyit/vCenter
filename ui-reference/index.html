<style id="vcenter-dark-theme">
:root {
  color-scheme: dark;
  --canvas: #1b2a32;
  --panel: #21333b;
  --toolbar: #304250;
  --raised: #29414e;
  --border: #495865;
  --shadow: #0e161b;
  --text: #f3f6f8;
  --muted: #bacbd6;
  --accent: #4aaed9;
  --focus: #7ad2ef;
  --selection: #d8e3e9;
  --success: #9dd18e;
  --warning: #f5cf84;
}

body { background: var(--canvas); color: var(--text); }
aside { background: var(--canvas); color: var(--text); border-right: 1px solid var(--border); }
.brand, .top .brand { color: var(--text); }
.brand span { background: var(--accent); color: var(--shadow); }
.sub, .sidefoot { color: var(--muted); }
.sidefoot { border-color: var(--border); }
nav button { color: var(--muted); }
nav button:hover { background: var(--raised); color: var(--text); }
nav button.active { background: var(--raised); color: var(--text); box-shadow: inset 3px 0 var(--accent); }
.top { background: var(--toolbar); border-color: var(--border); padding-inline: 16px; }
.avatar { background: var(--raised); color: var(--text); }
.pill { background: var(--panel); border-color: var(--border); color: var(--text); }

p, label, .muted, .kicker, .number small, .tiny, .legend, td small,
.footer, .empty, .host-pick small, .setting-row span { color: var(--muted); }
a, .link { color: var(--accent); }
a:hover, .link:hover { color: var(--focus); }
.card { background: var(--panel); border-color: var(--shadow); }
.demo { background: var(--raised); border-color: var(--border); color: var(--text); }
.hosticon { background: var(--raised); color: var(--accent); }
.bar, .step span { background: var(--raised); }
.bar b, .step .done { background: var(--accent); }

.btn { background: transparent; border-color: var(--accent); color: var(--focus); }
.btn:hover, .host-pick:hover, .host-tabs button:hover, .choice:hover { background: var(--raised); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--shadow); }
.btn.primary:hover { background: var(--focus); border-color: var(--focus); }
.host-tabs button, .host-pick, .choice { background: var(--panel); border-color: var(--border); color: var(--text); }
.host-tabs button.chosen, .choice.selected { background: var(--raised); color: var(--text); border-color: var(--accent); }
.host-tabs button.chosen { box-shadow: inset 0 -2px var(--accent); }
.host-pick.chosen { background: var(--selection); color: var(--shadow); border-color: var(--selection); }
.host-pick.chosen small { color: #304250; }

input, select, .search { background: var(--canvas); color: var(--text); border-color: var(--border); }
input::placeholder { color: var(--muted); opacity: 1; }
button:focus-visible, input:focus, select:focus { outline-color: var(--focus); }
dialog { background: var(--panel); color: var(--text); border: 1px solid var(--border); }
dialog::backdrop { background: #0e161bc2; }
.toast { background: var(--raised); color: var(--text); border: 1px solid var(--border); }

th { background: var(--raised); color: var(--text); }
td, th, .host, .activity, .setting-row, .service-row { border-color: var(--border); }
tbody tr:hover { background: var(--raised); }
.badge { background: #284638; color: var(--success); }
.badge.off { background: var(--raised); color: var(--muted); }
.dot { background: var(--success); }
.green { color: var(--success); }
.badge.warning, .hosticon.warning { background: #473b2c; color: var(--warning); }
.chart-grid { stroke: var(--border); }
.chart-cpu { stroke: var(--accent); }
.chart-memory { stroke: var(--muted); }
.legend-cpu { color: var(--accent); }

@media (max-width: 650px) {
  aside { border-right: 0; border-top: 1px solid var(--border); }
  nav button.active { box-shadow: inset 0 2px var(--accent); }
  .top { margin-inline: -16px; padding-inline: 10px; }
}


.profile-checkbox { display: flex; align-items: flex-start; gap: 8px; }
.profile-checkbox input { width: auto; margin: 1px 0 0; accent-color: var(--accent); }
.more-nav { display: none; }

@media (max-width: 650px) {
  #nav {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    overflow: hidden;
  }
  #nav button { width: 100%; min-width: 0; }
  #nav button:nth-child(n+6) { display: none; }
  .top > div:last-child { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .top .avatar { display: none; }
  .top .pill { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .more-nav { display: block; position: relative; flex: none; }
  .more-nav summary {
    display: grid;
    place-items: center;
    width: 44px;
    height: 44px;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: var(--panel);
    color: var(--text);
    list-style: none;
    cursor: pointer;
  }
  .more-nav summary::-webkit-details-marker { display: none; }
  .hamburger {
    display: block;
    width: 18px;
    height: 14px;
    border-block: 2px solid currentColor;
    position: relative;
  }
  .hamburger::after {
    content: "";
    position: absolute;
    top: 4px;
    inset-inline: 0;
    border-top: 2px solid currentColor;
  }
  .more-nav-items {
    position: absolute;
    z-index: 6;
    inset-inline-end: 0;
    top: calc(100% + 8px);
    width: 190px;
    padding: 5px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--panel);
    box-shadow: 0 8px 20px #0006;
  }
  .more-nav-items button {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    min-height: 44px;
    padding: 8px 12px;
    text-align: left;
    border: 0;
    border-radius: 5px;
    background: transparent;
    color: var(--text);
  }
  .more-nav-items button:hover,
  .more-nav-items button.active { background: var(--raised); }
  .more-nav-items i { width: 18px; text-align: center; font-style: normal; }
}
</style></html>
